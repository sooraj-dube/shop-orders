[project]
name = "shop-orders"
version = "1.0.0"
description = "Order lifecycle for the shop: placement, payment confirmation, cancellation, shipping status."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "shop-platform>=0.3,<0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orders*"]

[tool.setuptools.package-data]
orders = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
